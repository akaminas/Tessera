<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tessera: collaborative project management for individuals, teams and multi-partner projects." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Tessera</title>
    <script>
      // GitHub Pages SPA support: restore the route encoded by 404.html.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
      // Apply stored appearance before first paint to avoid a flash.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('tessera.ui') || '{}');
          var t = p.theme || 'light';
          if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          if (p.density) document.documentElement.dataset.density = p.density;
          if (p.motion) document.documentElement.dataset.motion = p.motion;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tessera needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
